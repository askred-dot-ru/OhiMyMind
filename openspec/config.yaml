project:
  name: Oh!MyMind
  description: "Classification, storage and distribution of knowledge streams. Mail is stream #1. Slug without '!': OhiMyMind."

context:
  tech_stack:
    - FastAPI
    - React
    - PostgreSQL
    - pgvector
    - Docker Compose
  conventions:
    - Config only via environment variables
    - Per-stream native structure plus common envelope
    - Messengers are ingest sources, not agent control
  constraints:
    - Standalone product in v1: no 1C tables, routes, or env
    - Later hypothetical: outbound HTTP from Oh!MyMind (URL unknown)
    - Config only via environment variables
